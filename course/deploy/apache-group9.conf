# Build with APP_BASE=/group9/. Requires alias, deflate, filter, headers, http2,
# proxy and proxy_http. The installer maintains /opt/group9-live/current.
Protocols h2 http/1.1
ProxyPreserveHost On
ProxyPass "/group9/assets/" "!"
Alias "/group9/assets/" "/opt/group9-live/current/dist/assets/"
<Directory "/opt/group9-live/current/dist/assets/">
    Require all granted
    Header set Cache-Control "public, max-age=31536000, immutable"
    Header set X-Content-Type-Options "nosniff"
    AddOutputFilterByType DEFLATE text/css text/javascript application/javascript
</Directory>
ProxyPass "/group9/" "http://127.0.0.1:4180/" upgrade=websocket timeout=60
ProxyPassReverse "/group9/" "http://127.0.0.1:4180/"
