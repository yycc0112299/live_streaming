# Build with APP_BASE=/group9/. Requires proxy and proxy_http, Apache 2.4.47+.
# Dedicated subpath preserves the VM's existing course website at /.
<Location "/group9/">
    ProxyPreserveHost On
    ProxyPass "http://127.0.0.1:4180/" upgrade=websocket timeout=60
    ProxyPassReverse "http://127.0.0.1:4180/"
</Location>
