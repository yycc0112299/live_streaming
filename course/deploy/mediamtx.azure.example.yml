logLevel: info
rtsp: false
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcIPsFromInterfaces: false
webrtcAdditionalHosts: [20.89.110.14]
webrtcHandshakeTimeout: 30s
srt: false
moq: false
rtmp: true
rtmpAddress: :1936
rtmpEncryption: strict
rtmpServerKey: /opt/group9-live/shared/tls/privkey.pem
rtmpServerCert: /opt/group9-live/shared/tls/fullchain.pem
hls: true
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
api: true
apiAddress: 127.0.0.1:9997
authMethod: internal
authInternalUsers:
  - user: broadcaster
    pass: REPLACE_WITH_LIVE_SECRET
    permissions:
      - action: publish
        path: live
  - user: guest_broadcaster
    pass: REPLACE_WITH_GUEST_SECRET
    permissions:
      - action: publish
        path: guest
  - user: any
    ips: [127.0.0.1, '::1', 172.30.9.0/24]
    permissions:
      - action: read
        path: live
      - action: read
        path: guest
      - action: api
paths:
  live:
    source: publisher
    overridePublisher: false

  guest:
    source: publisher
    overridePublisher: false
