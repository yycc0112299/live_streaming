logLevel: info
rtsp: false
webrtc: false
srt: false
moq: false
rtmp: true
rtmpAddress: :1935
hls: true
hlsAddress: :8888
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
api: true
apiAddress: :9997
authMethod: internal
authInternalUsers:
  - user: broadcaster
    pass: REPLACE_WITH_RANDOM_SECRET
    permissions:
      - action: publish
        path: live
  - user: any
    ips: [127.0.0.1, '::1', 172.30.9.0/24]
    permissions:
      - action: read
        path: live
      - action: api
paths:
  live:
    source: publisher
    overridePublisher: false
