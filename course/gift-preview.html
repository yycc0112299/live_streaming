<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gift 3D Preview</title>
<style>
  body { margin:0; background:#0b1220; color:#e8edf5; font:14px system-ui, sans-serif; }
  .bar { display:flex; gap:8px; padding:12px; flex-wrap:wrap; }
  button { background:#172034; color:#e8edf5; border:1px solid #384457; border-radius:8px; padding:8px 12px; cursor:pointer; }
  .stage { position:relative; margin:0 12px; aspect-ratio:16/9; max-width:960px; border-radius:14px; overflow:hidden; background:linear-gradient(135deg,#1b2640,#0b1220); }
  .gift-canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
</style>
</head>
<body>
<!-- Dev-only preview of src/gift3d.js (npm run dev, then open /gift-preview.html). Not part of the production build. -->
<div class="bar" id="bar"></div>
<div class="stage" id="c"></div>
<script type="module">
  import { playGift3D } from './src/gift3d.js';
  import { GIFTS } from './gifts.mjs';
  const canvas = document.getElementById('c');
  let stop;
  window.playGift = (kind) => { stop?.(); const g = GIFTS.find((x) => x.kind === kind); stop = playGift3D(canvas, kind, g.duration); return g.duration; };
  for (const g of GIFTS) { const b = document.createElement('button'); b.textContent = `${g.amount} · ${g.kind}`; b.onclick = () => window.playGift(g.kind); document.getElementById('bar').append(b); }
</script>
</body>
</html>
